# Wydanie aplikacji (jak w KarKa): każda zmiana w main buduje SC2CCM.app (Apple Silicon). Jeśli wydania
# v<Version z SC2CCM.Mac.csproj> jeszcze nie ma, tworzy je (z tagiem) i dołącza .zip; jeśli jest – tylko ostrzeżenie.
# Nowe wydanie = podniesienie <Version> w src/SC2CCM.Mac/SC2CCM.Mac.csproj.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SC2CCM.Mac/SC2CCM.Mac.csproj | head -1)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::warning::Release v$version already exists - bump <Version> in SC2CCM.Mac.csproj to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Core smoke tests
        run: dotnet run --project tests/SC2CCM.Core.Tests

      - name: Build .app (Apple Silicon)
        run: bash build-mac.sh

      - name: Verify signature
        run: codesign --verify --deep --strict dist/SC2CCM.app

      - name: Create release
        if: steps.v.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/*.zip --latest --target "$GITHUB_SHA" \
            --title "SC2CCM for macOS ${{ steps.v.outputs.tag }}" \
            --notes-file - <<'EOF'
          StarCraft II Custom Campaign Manager for macOS — **Apple Silicon (M1 and newer)**, macOS 12+.

          ### Install
          1. Download the `.zip` below and unzip it.
          2. Move **SC2CCM.app** to **Applications**.
          3. The app is not notarized by Apple, so the first launch is blocked: right-click **SC2CCM.app → Open → Open**
             (or System Settings → Privacy & Security → **Open Anyway**).
             Terminal alternative: `xattr -dr com.apple.quarantine /Applications/SC2CCM.app`

          ### Use
          Drop a campaign `.zip` (or folder) onto the window, pick it from the list and click **Set Active**.
          **Restore Default** brings back the Blizzard campaign. StarCraft II is detected in `/Applications/StarCraft II`.

          Based on SC2CCM by 7thAce and GiantGrantGames (MIT License).
          EOF
